name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lib
        run: echo "commit=$(git rev-parse HEAD:lib)" >> "$GITHUB_OUTPUT"
      # the deploy key opens sannce-aio only; without it the token reads a public repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Paol0B/sannce-aio
          ref: ${{ steps.lib.outputs.commit }}
          path: lib
          ssh-key: ${{ secrets.SANNCE_AIO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: scripts/bench.sh test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-assistant-log
          path: bench/ha-config/home-assistant.log*
          if-no-files-found: warn
      - if: always()
        run: scripts/bench.sh down
